[settings]
minimum_release_age = "7d"

[tools]
gitleaks = "latest"
go = "latest"
golangci-lint = "latest"
lefthook = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
protoc = "latest"

[tasks."go:update"]
description = "各 go.mod ディレクトリで順次 get -u と tidy を実行"
run = """
find . -name "go.mod" -not -path "*/.*" | while read -r modfile; do
  dir=$(dirname "$modfile")
  echo "----------------------------------------"
  echo "📦 Updating: $dir"
  echo "----------------------------------------"
  (
    cd "$dir" || exit 1
    go get -u ./...
    go mod tidy
  )
done
echo "✅ All modules updated!"
"""

[tasks."go:fix"]
description = "各 go.mod ディレクトリで順次 fix を実行"
run = """
find . -name "go.mod" -not -path "*/.*" | while read -r modfile; do
  dir=$(dirname "$modfile")
  echo "----------------------------------------"
  echo "📦 Updating: $dir"
  echo "----------------------------------------"
  (
    cd "$dir" || exit 1
    go fix -newexpr ./...
  )
done
echo "✅ All modules updated!"
"""
